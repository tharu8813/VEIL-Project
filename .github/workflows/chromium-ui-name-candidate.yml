name: Chromium UI name candidate

on:
  pull_request:
    paths:
      - 'scripts/chromium/generate-ui-name-candidate.py'
      - 'tests/chromium/ui-name-candidate.test.py'
      - '.github/workflows/chromium-ui-name-candidate.yml'
      - 'scripts/chromium/pinned_gitiles.py'
      - 'chromium/candidate.json'
      - 'chromium/patches/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test scoped rewrite
        run: python3 tests/chromium/ui-name-candidate.test.py
      - name: Verify registered patch exactly matches upstream-derived candidate
        run: python3 scripts/chromium/generate-ui-name-candidate.py --verify-registered
