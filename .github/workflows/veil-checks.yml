name: VEIL Windows build and core checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: veil-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-build:
    name: Windows .NET build / source checks
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore locked dependencies
        shell: pwsh
        run: |
          dotnet restore apps/desktop/Veil.Desktop.csproj --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore apps/broker/Veil.VolumeBroker/Veil.VolumeBroker.csproj --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Third-party license policy (ADR-0010)
        shell: pwsh
        run: node scripts/third-party.mjs --check

      - name: Compile Debug and Release
        shell: pwsh
        run: |
          foreach ($configuration in @('Debug', 'Release')) {
            dotnet build apps/desktop/Veil.Desktop.csproj -c $configuration --no-restore --nologo
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            dotnet build apps/broker/Veil.VolumeBroker/Veil.VolumeBroker.csproj -c $configuration --no-restore --nologo
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      # Compile-only: the native CEF package and interactive WPF runtime are not exercised here.
      - name: Compile CEF managed smoke adapter
        shell: pwsh
        run: dotnet build apps/cef-smoke/wpf/Veil.Cef.WpfSmoke.csproj -c Release --nologo

      - name: Validate Node test syntax
        shell: pwsh
        run: |
          Get-ChildItem tests -Filter '*.mjs' -Recurse | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Syntax check failed: $($_.FullName)" }
          }

      - name: Parse installer scripts using Windows PowerShell 5.1
        shell: powershell
        run: |
          Get-ChildItem scripts, tests -Filter '*.ps1' -Recurse | ForEach-Object {
            $tokens = $null
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              throw "PowerShell parse errors in $($_.FullName): $($errors -join '; ')"
            }
          }

      - name: Check service installer safety invariants
        shell: pwsh
        run: node --test tests/install/broker-service-contract.test.mjs tests/install/package-maintenance-contract.test.mjs tests/install/package-version.test.mjs tests/install/package-manifest.test.mjs

      - name: Check VM package evidence completeness
        shell: powershell
        run: |
          .\tests\install\package-evidence.test.ps1
          .\tests\install\package-checkpoints.test.ps1

      - name: Test BitLocker recovery flow with a fake provider
        shell: powershell
        run: .\tests\install\bitlocker-recovery.test.ps1

      - name: Test CEF registration consistency plan without installation
        shell: powershell
        run: .\tests\install\cef-registration-plan.test.ps1

      - name: Test signed CEF candidate evidence without installation
        shell: powershell
        run: .\tests\install\cef-candidate-evidence.test.ps1

      - name: Test isolated CEF candidate staging
        shell: powershell
        run: .\tests\install\cef-candidate-staging.test.ps1

      # SEC-004: the Procmon trace analyzer is pure parsing; the capture itself runs only in the VM.
      - name: Check local-write evidence analyzers
        shell: pwsh
        run: node --test tests/security/async-handlers.test.mjs tests/security/profile-gate-contract.test.mjs tests/security/outside-writes.test.mjs tests/security/jump-list-evidence.test.mjs tests/phase3/phase34-vm.test.mjs tests/phase3/power-loss.test.mjs tests/vm/internet-batch.test.mjs

      - name: Check download retry context contract
        shell: pwsh
        run: node --test tests/security/download-retry-contract.test.mjs tests/security/network-policy-contract.test.mjs tests/security/tab-lifetime-contract.test.mjs

      - name: Test fixed HTTP proxy and refusal of direct fallback
        shell: pwsh
        run: dotnet run --project tests/security/NetworkPolicyCheck/NetworkPolicyCheck.csproj -c Release

      # A disposable synthetic process test needs no service, real profile or UI.
      - name: Test synthetic Windows CEF child handle binding
        shell: pwsh
        run: dotnet run --project tests/security/CefProcessBindingCheck/CefProcessBindingCheck.csproj -c Release

      - name: Test suspended CEF child containment with synthetic apphost
        shell: pwsh
        run: dotnet run --project tests/security/CefContainmentCheck/CefContainmentCheck.csproj -c Release

      - name: Test retained CEF runtime file handles and exact inventory
        shell: pwsh
        run: dotnet run --project tests/security/CefRuntimeFileCheck/CefRuntimeFileCheck.csproj -c Release

      # Hosted runners may be elevated and do not provide an interactive desktop.
      # Running the WPF smoke suite or broker authorization test here would
      # incorrectly test the runner, not a regular Windows user's security token.
      # Run ordinary WPF smoke tests in an interactive standard-user Windows session.
      # Run authorization against the installed broker in the isolated VM integration session.

  rust-security:
    name: Rust authenticated encryption tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain version
        id: toolchain
        run: |
          rustc -V
          echo "rustc=$(rustc -V | tr ' ' '-')" >> "$GITHUB_OUTPUT"
      # Only downloaded crates and build outputs are cached. The cache key covers the lock file,
      # the manifest (profiles) and the compiler, so a change in any of them rebuilds from source.
      - name: Cargo cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            crates/veil-security/target
          key: rust-${{ runner.os }}-${{ steps.toolchain.outputs.rustc }}-${{ hashFiles('crates/veil-security/Cargo.lock', 'crates/veil-security/Cargo.toml') }}
          restore-keys: rust-${{ runner.os }}-${{ steps.toolchain.outputs.rustc }}-
      - name: Build tests
        run: cargo test --locked --manifest-path crates/veil-security/Cargo.toml --no-run
      # Full security suite, every test serially, each with its own timing in the log and step summary.
      - name: Run Rust tests (per-test timing)
        run: bash scripts/rust-timed-tests.sh
      - name: Clippy
        run: cargo clippy --locked --manifest-path crates/veil-security/Cargo.toml --all-targets -- -D warnings
