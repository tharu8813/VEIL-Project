name: Chromium development profile contract
on:
  pull_request:
    paths:
      - 'chromium/dev/profile-path-contract.h'
      - 'chromium/dev/diagnostic-path-contract.h'
      - 'chromium/dev/diagnostic-observation-win.h'
      - 'tests/chromium/diagnostic-observation-win.test.cc'
      - 'tests/chromium/diagnostic-observation-win.test.ps1'
      - 'tests/chromium/diagnostic-path-contract.test.cc'
      - 'tests/chromium/profile-path-contract.test.cc'
      - 'chromium/dev/profile-filesystem-win.h'
      - 'chromium/dev/profile-policy-win.h'
      - 'chromium/dev/profile-combined-win.h'
      - 'tests/chromium/profile-combined-win.test.cc'
      - 'tests/chromium/profile-filesystem-win.test.cc'
      - 'tests/chromium/profile-filesystem-win.test.ps1'
      - '.github/workflows/chromium-profile-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lexical-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile and test standalone C++17 contract
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic tests/chromium/profile-path-contract.test.cc -o "$RUNNER_TEMP/profile-contract"
          "$RUNNER_TEMP/profile-contract"
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic tests/chromium/diagnostic-path-contract.test.cc -o "$RUNNER_TEMP/diagnostic-contract"
          "$RUNNER_TEMP/diagnostic-contract"
  windows-filesystem-observation:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build standalone Windows observation fixture
        shell: pwsh
        run: |
          $vswhere = Join-Path ([Environment]::GetEnvironmentVariable('ProgramFiles(x86)')) 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'MSVC toolchain not observed.' }
          $setup = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          $exe = Join-Path $env:RUNNER_TEMP 'veil-profile-observation.exe'
          $obj = Join-Path $env:RUNNER_TEMP 'veil-profile-observation.obj'
          $command = 'call "{0}" && cl /nologo /std:c++17 /EHsc /W4 /WX /Fe:"{1}" /Fo:"{2}" tests\chromium\profile-filesystem-win.test.cc' -f $setup,$exe,$obj
          & cmd.exe /d /c $command
          if ($LASTEXITCODE -ne 0) { throw 'Standalone Windows compilation failed.' }
          & .\tests\chromium\profile-filesystem-win.test.ps1 -Executable $exe
      - name: Compile and test combined standalone observation
        shell: pwsh
        run: |
          $vswhere = Join-Path ([Environment]::GetEnvironmentVariable('ProgramFiles(x86)')) 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'MSVC toolchain not observed.' }
          $setup = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          $exe = Join-Path $env:RUNNER_TEMP 'veil-combined-observation.exe'
          $obj = Join-Path $env:RUNNER_TEMP 'veil-combined-observation.obj'
          $command = 'call "{0}" && cl /nologo /std:c++17 /EHsc /W4 /WX /Fe:"{1}" /Fo:"{2}" tests\chromium\profile-combined-win.test.cc advapi32.lib' -f $setup,$exe,$obj
          & cmd.exe /d /c $command
          if ($LASTEXITCODE -ne 0) { throw 'Combined standalone compile failed.' }
          $root = Join-Path $env:RUNNER_TEMP ('veil-combined-fixture-' + [Guid]::NewGuid().ToString('N'))
          if (Test-Path -LiteralPath $root) { throw 'Fixture already exists.' }
          $null = New-Item -ItemType Directory -Path $root
          try {
            & $exe $root
            if ($LASTEXITCODE -ne 0) { throw 'Combined observation test failed.' }
            if (Test-Path -LiteralPath (Join-Path $root 'missing')) { throw 'Unexpected creation.' }
          } finally {
            [IO.Directory]::Delete($root)
          }
      - name: Compile and test standalone diagnostic observation
        shell: pwsh
        run: |
          $vswhere = Join-Path ([Environment]::GetEnvironmentVariable('ProgramFiles(x86)')) 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'MSVC toolchain not observed.' }
          $setup = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          $exe = Join-Path $env:RUNNER_TEMP 'veil-diagnostic-observation.exe'
          $obj = Join-Path $env:RUNNER_TEMP 'veil-diagnostic-observation.obj'
          $command = 'call "{0}" && cl /nologo /std:c++17 /EHsc /W4 /WX /Fe:"{1}" /Fo:"{2}" tests\chromium\diagnostic-observation-win.test.cc advapi32.lib' -f $setup,$exe,$obj
          & cmd.exe /d /c $command
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic observation compile failed.' }
          & .\tests\chromium\diagnostic-observation-win.test.ps1 -Executable $exe
