          $setup = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          $exe = Join-Path $env:RUNNER_TEMP 'veil-synthetic-pipe.exe'
          $obj = Join-Path $env:RUNNER_TEMP 'veil-synthetic-pipe.obj'
          $command = 'call "{0}" && cl /nologo /std:c++17 /EHsc /W4 /WX /Fe:"{1}" /Fo:"{2}" tests\chromium\synthetic-pipe-transport-win.test.cc' -f $setup,$exe,$obj
          & cmd.exe /d /c $command
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic pipe compile failed.' }
          $process = Start-Process -FilePath $exe -NoNewWindow -PassThru
          if (-not $process.WaitForExit(20000)) {
            $process.Kill()
            $process.WaitForExit()
            throw 'Synthetic pipe fixture exceeded outer watchdog.'
          }
          if ($process.ExitCode -ne 0) { throw "Synthetic pipe test failed: $($process.ExitCode)" }
