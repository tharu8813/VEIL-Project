name: Chromium development profile contract
on:
  pull_request:
    paths:
      - 'chromium/dev/profile-path-contract.h'
      - 'chromium/dev/volume-evidence-contract.h'
      - 'chromium/dev/broker-status-wire.h'
      - 'chromium/dev/broker-identity-win.h'
      - 'chromium/dev/config-acl-win.h'
      - 'chromium/dev/config-path-win.h'
      - 'tests/chromium/config-path-win.test.cc'
      - 'tests/chromium/config-path-win.test.ps1'
      - 'tests/chromium/config-acl-win.test.cc'
      - 'chromium/dev/synthetic-pipe-transport-win.h'
      - 'tests/chromium/synthetic-pipe-transport-win.test.cc'
      - 'tests/chromium/synthetic-pipe-identity-order.test.cc'
      - 'tests/chromium/broker-identity-win.test.cc'
      - 'tests/chromium/broker-status-wire.test.cc'
      - 'chromium/dev/volume-observation-win.h'
      - 'tests/chromium/volume-observation-win.test.cc'
      - 'tests/chromium/volume-observation-win.test.ps1'
      - 'tests/chromium/volume-evidence-contract.test.cc'
      - 'chromium/dev/diagnostic-path-contract.h'
      - 'chromium/dev/diagnostic-observation-win.h'
      - 'tests/chromium/diagnostic-observation-win.test.cc'
      - 'tests/chromium/diagnostic-observation-win.test.ps1'
      - 'tests/chromium/diagnostic-path-contract.test.cc'
      - 'tests/chromium/profile-path-contract.test.cc'
      - 'chromium/dev/profile-filesystem-win.h'
      - 'chromium/dev/profile-policy-win.h'
      - 'chromium/dev/profile-combined-win.h'
      - 'tests/chromium/profile-combined-win.test.cc'
      - 'tests/chromium/profile-filesystem-win.test.cc'
      - 'tests/chromium/profile-filesystem-win.test.ps1'
      - '.github/workflows/chromium-profile-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lexical-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile and test standalone C++17 contract
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic tests/chromium/profile-path-contract.test.cc -o "$RUNNER_TEMP/profile-contract"
          "$RUNNER_TEMP/profile-contract"
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic tests/chromium/diagnostic-path-contract.test.cc -o "$RUNNER_TEMP/diagnostic-contract"
          "$RUNNER_TEMP/diagnostic-contract"
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic tests/chromium/volume-evidence-contract.test.cc -o "$RUNNER_TEMP/volume-evidence-contract"
          "$RUNNER_TEMP/volume-evidence-contract"
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic tests/chromium/broker-status-wire.test.cc -o "$RUNNER_TEMP/broker-status-wire"
          "$RUNNER_TEMP/broker-status-wire"
  windows-filesystem-observation:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build standalone Windows observation fixture
        shell: pwsh
        run: |
          $vswhere = Join-Path ([Environment]::GetEnvironmentVariable('ProgramFiles(x86)')) 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'MSVC toolchain not observed.' }
          $setup = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          $exe = Join-Path $env:RUNNER_TEMP 'veil-profile-observation.exe'
          $obj = Join-Path $env:RUNNER_TEMP 'veil-profile-observation.obj'
          $command = 'call "{0}" && cl /nologo /std:c++17 /EHsc /W4 /WX /Fe:"{1}" /Fo:"{2}" tests\chromium\profile-filesystem-win.test.cc' -f $setup,$exe,$obj
          & cmd.exe /d /c $command
          if ($LASTEXITCODE -ne 0) { throw 'Standalone Windows compilation failed.' }
          & .\tests\chromium\profile-filesystem-win.test.ps1 -Executable $exe
      - name: Compile and test combined standalone observation
        shell: pwsh
        run: |
          $vswhere = Join-Path ([Environment]::GetEnvironmentVariable('ProgramFiles(x86)')) 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'MSVC toolchain not observed.' }
          $setup = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          $exe = Join-Path $env:RUNNER_TEMP 'veil-combined-observation.exe'
          $obj = Join-Path $env:RUNNER_TEMP 'veil-combined-observation.obj'
          $command = 'call "{0}" && cl /nologo /std:c++17 /EHsc /W4 /WX /Fe:"{1}" /Fo:"{2}" tests\chromium\profile-combined-win.test.cc advapi32.lib' -f $setup,$exe,$obj
          & cmd.exe /d /c $command
          if ($LASTEXITCODE -ne 0) { throw 'Combined standalone compile failed.' }
          $root = Join-Path $env:RUNNER_TEMP ('veil-combined-fixture-' + [Guid]::NewGuid().ToString('N'))
          if (Test-Path -LiteralPath $root) { throw 'Fixture already exists.' }
          $null = New-Item -ItemType Directory -Path $root
          try {
            & $exe $root
            if ($LASTEXITCODE -ne 0) { throw 'Combined observation test failed.' }
            if (Test-Path -LiteralPath (Join-Path $root 'missing')) { throw 'Unexpected creation.' }
          } finally {
            [IO.Directory]::Delete($root)
          }
      - name: Compile and test standalone diagnostic observation
        shell: pwsh
        run: |
          $vswhere = Join-Path ([Environment]::GetEnvironmentVariable('ProgramFiles(x86)')) 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'MSVC toolchain not observed.' }
          $setup = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          $exe = Join-Path $env:RUNNER_TEMP 'veil-diagnostic-observation.exe'
          $obj = Join-Path $env:RUNNER_TEMP 'veil-diagnostic-observation.obj'
          $command = 'call "{0}" && cl /nologo /std:c++17 /EHsc /W4 /WX /Fe:"{1}" /Fo:"{2}" tests\chromium\diagnostic-observation-win.test.cc advapi32.lib' -f $setup,$exe,$obj
          & cmd.exe /d /c $command
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic observation compile failed.' }
          & .\tests\chromium\diagnostic-observation-win.test.ps1 -Executable $exe
      - name: Compile and test standalone volume identity observation
        shell: pwsh
        run: |
          $vswhere = Join-Path ([Environment]::GetEnvironmentVariable('ProgramFiles(x86)')) 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'MSVC toolchain not observed.' }
          $setup = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          $exe = Join-Path $env:RUNNER_TEMP 'veil-volume-observation.exe'
          $obj = Join-Path $env:RUNNER_TEMP 'veil-volume-observation.obj'
          $command = 'call "{0}" && cl /nologo /std:c++17 /EHsc /W4 /WX /Fe:"{1}" /Fo:"{2}" tests\chromium\volume-observation-win.test.cc' -f $setup,$exe,$obj
          & cmd.exe /d /c $command
          if ($LASTEXITCODE -ne 0) { throw 'Volume observation compile failed.' }
          & .\tests\chromium\volume-observation-win.test.ps1 -Executable $exe
      - name: Compile and test standalone broker identity observation
        shell: pwsh
        run: |
          $vswhere = Join-Path ([Environment]::GetEnvironmentVariable('ProgramFiles(x86)')) 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'MSVC toolchain not observed.' }
          $setup = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          $exe = Join-Path $env:RUNNER_TEMP 'veil-broker-identity.exe'
          $obj = Join-Path $env:RUNNER_TEMP 'veil-broker-identity.obj'
          $command = 'call "{0}" && cl /nologo /std:c++17 /EHsc /W4 /WX /Fe:"{1}" /Fo:"{2}" tests\chromium\broker-identity-win.test.cc advapi32.lib' -f $setup,$exe,$obj
          & cmd.exe /d /c $command
          if ($LASTEXITCODE -ne 0) { throw 'Broker identity compile failed.' }
          & $exe
          if ($LASTEXITCODE -ne 0) { throw 'Broker identity observation failed.' }
      - name: Compile and test synthetic local pipe transport
        shell: pwsh
        run: |
          $vswhere = Join-Path ([Environment]::GetEnvironmentVariable('ProgramFiles(x86)')) 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'MSVC toolchain not observed.' }
          $setup = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          $exe = Join-Path $env:RUNNER_TEMP 'veil-synthetic-pipe.exe'
          $obj = Join-Path $env:RUNNER_TEMP 'veil-synthetic-pipe.obj'
          $command = 'call "{0}" && cl /nologo /std:c++17 /EHsc /W4 /WX /Fe:"{1}" /Fo:"{2}" tests\chromium\synthetic-pipe-transport-win.test.cc' -f $setup,$exe,$obj
          & cmd.exe /d /c $command
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic pipe compile failed.' }
          $process = Start-Process -FilePath $exe -NoNewWindow -PassThru
          if (-not $process.WaitForExit(20000)) {
            $process.Kill()
            $process.WaitForExit()
            throw 'Synthetic pipe fixture exceeded outer watchdog.'
          }
          if ($process.ExitCode -ne 0) { throw "Synthetic pipe test failed: $($process.ExitCode)" }
      - name: Compile and test synthetic pipe identity ordering
        shell: pwsh
        run: |
          $vswhere = Join-Path ([Environment]::GetEnvironmentVariable('ProgramFiles(x86)')) 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'MSVC toolchain not observed.' }
          $setup = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          $exe = Join-Path $env:RUNNER_TEMP 'veil-pipe-identity-order.exe'
          $obj = Join-Path $env:RUNNER_TEMP 'veil-pipe-identity-order.obj'
          $command = 'call "{0}" && cl /nologo /std:c++17 /EHsc /W4 /WX /Fe:"{1}" /Fo:"{2}" tests\chromium\synthetic-pipe-identity-order.test.cc advapi32.lib' -f $setup,$exe,$obj
          & cmd.exe /d /c $command
          if ($LASTEXITCODE -ne 0) { throw 'Pipe identity ordering compile failed.' }
          $process = Start-Process -FilePath $exe -NoNewWindow -PassThru
          if (-not $process.WaitForExit(20000)) {
            $process.Kill()
            $process.WaitForExit()
            throw 'Pipe identity fixture exceeded outer watchdog.'
          }
          if ($process.ExitCode -ne 0) { throw "Pipe identity test failed: $($process.ExitCode)" }
      - name: Compile and test standalone config ACL observation
        shell: pwsh
        run: |
          $vswhere = Join-Path ([Environment]::GetEnvironmentVariable('ProgramFiles(x86)')) 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'MSVC toolchain not observed.' }
          $setup = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          $exe = Join-Path $env:RUNNER_TEMP 'veil-config-acl.exe'
          $obj = Join-Path $env:RUNNER_TEMP 'veil-config-acl.obj'
          $command = 'call "{0}" && cl /nologo /std:c++17 /EHsc /W4 /WX /Fe:"{1}" /Fo:"{2}" tests\chromium\config-acl-win.test.cc advapi32.lib' -f $setup,$exe,$obj
          & cmd.exe /d /c $command
          if ($LASTEXITCODE -ne 0) { throw 'Config ACL compile failed.' }
          $root = Join-Path $env:RUNNER_TEMP ('veil-config-acl-fixture-' + [Guid]::NewGuid().ToString('N'))
          if (Test-Path -LiteralPath $root) { throw 'Fixture already exists.' }
          $null = New-Item -ItemType Directory -Path $root
          try {
            & $exe $root
            if ($LASTEXITCODE -ne 0) { throw "Config ACL observation failed: $LASTEXITCODE" }
          } finally {
            $file = Join-Path $root 'untrusted-fixture.json'
            if (Test-Path -LiteralPath $file) { [IO.File]::Delete($file) }
            [IO.Directory]::Delete($root)
          }
      - name: Compile and test standalone config path observation
        shell: pwsh
        run: |
          $vswhere = Join-Path ([Environment]::GetEnvironmentVariable('ProgramFiles(x86)')) 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'MSVC toolchain not observed.' }
          $setup = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          $exe = Join-Path $env:RUNNER_TEMP 'veil-config-path.exe'
          $obj = Join-Path $env:RUNNER_TEMP 'veil-config-path.obj'
          $command = 'call "{0}" && cl /nologo /std:c++17 /EHsc /W4 /WX /Fe:"{1}" /Fo:"{2}" tests\chromium\config-path-win.test.cc advapi32.lib' -f $setup,$exe,$obj
          & cmd.exe /d /c $command
          if ($LASTEXITCODE -ne 0) { throw 'Config path compile failed.' }
          & .\tests\chromium\config-path-win.test.ps1 -Executable $exe
