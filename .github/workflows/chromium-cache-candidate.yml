name: Chromium startup cache failure candidate
on:
  pull_request:
    paths:
      - 'scripts/chromium/generate-cache-failure-candidate.py'
      - 'tests/chromium/cache-failure-candidate.test.py'
      - 'scripts/chromium/pinned_gitiles.py'
      - 'chromium/candidate.json'
      - '.github/workflows/chromium-cache-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cache-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test exact rewrite and synthetic C++ function
        run: python3 tests/chromium/cache-failure-candidate.test.py
      - name: Validate exact source fixture patch
        run: python3 scripts/chromium/generate-cache-failure-candidate.py
