name: Chromium pinned build requirements observation
on:
  pull_request:
    paths:
      - 'chromium/candidate.json'
      - 'scripts/chromium/observe_build_requirements.py'
      - 'scripts/chromium/observe_local_build_requirements.py'
      - 'tests/chromium/local-build-requirements.test.py'
      - 'scripts/chromium/pinned_gitiles.py'
      - 'tests/chromium/build-requirements.test.py'
      - '.github/workflows/chromium-build-requirements.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pinned-build-requirements:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test bounded tree and blob binding
        run: python3 tests/chromium/build-requirements.test.py
      - name: Test offline exact Git object observation
        run: python3 tests/chromium/local-build-requirements.test.py
      - name: Observe pinned upstream files without executing them
        run: python3 scripts/chromium/observe_build_requirements.py
