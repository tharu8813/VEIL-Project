name: "기능 제안"
description: "새 기능 또는 사용성 개선을 제안합니다."
title: "[Feature] "
body:
  - type: "markdown"
    attributes:
      value: "보안 취약점은 이 양식으로 신고하지 마세요. [보안 정책](https://github.com/tharu8813/VEIL-Project/blob/main/SECURITY.md)을 확인하고, 쿠키·비밀번호·키·개인정보·민감한 URL이나 로그를 첨부하지 마세요."
  - type: "textarea"
    id: "problem"
    attributes:
      label: "해결할 문제"
      description: "현재 불편한 점이나 필요한 사용 상황"
    validations:
      required: true
  - type: "textarea"
    id: "proposal"
    attributes:
      label: "제안하는 개선"
      description: "원하는 동작과 이용 흐름"
    validations:
      required: true
  - type: "textarea"
    id: "impact"
    attributes:
      label: "개인정보·호환성 영향"
      description: "보호 범위, 기존 기능 영향, 대안 등"
    validations:
      required: false
  - type: "checkboxes"
    id: "confirmation"
    attributes:
      label: "제출 전 확인"
      options:
        - label: "취약점 세부 정보와 개인정보를 포함하지 않았습니다."
          required: true
