name: "버그 신고"
description: "VEIL의 일반 기능 오류를 신고합니다."
title: "[Bug] "
body:
  - type: "markdown"
    attributes:
      value: "보안 취약점은 이 양식으로 신고하지 마세요. [보안 정책](https://github.com/tharu8813/VEIL-Project/blob/main/SECURITY.md)을 확인하고, 쿠키·비밀번호·키·개인정보·민감한 URL이나 로그를 첨부하지 마세요."
  - type: "input"
    id: "version"
    attributes:
      label: "버전 또는 커밋"
      description: "개발 빌드의 버전이나 커밋 SHA"
    validations:
      required: true
  - type: "input"
    id: "environment"
    attributes:
      label: "실행 환경"
      description: "Windows / WebView2 버전, Debug 또는 Release"
    validations:
      required: true
  - type: "textarea"
    id: "steps"
    attributes:
      label: "재현 절차"
      description: "합성 데이터로 재현하는 단계를 순서대로 작성하세요."
    validations:
      required: true
  - type: "textarea"
    id: "actual"
    attributes:
      label: "실제 동작"
      description: "오류나 예상과 다른 동작"
    validations:
      required: true
  - type: "textarea"
    id: "expected"
    attributes:
      label: "기대 동작"
      description: "정상적으로 기대한 결과"
    validations:
      required: true
  - type: "textarea"
    id: "evidence"
    attributes:
      label: "추가 증거"
      description: "민감 정보를 제거한 로그 또는 스크린샷"
    validations:
      required: false
  - type: "checkboxes"
    id: "confirmation"
    attributes:
      label: "제출 전 확인"
      options:
        - label: "취약점 세부 정보와 개인정보를 포함하지 않았습니다."
          required: true
